name: Test OpenRabbit custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke OpenRabbit with custom inputs (expect failure without real credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          llm_provider: openai
          llm_api_url: https://api.openai.com/v1
          llm_api_key: fake-api-key
          llm_model: gpt-4o
          review_mode: summary
          tone_mode: concise
          review_lens: security
          debiased_mode: "true"

      - name: Assert action was invoked (setup and build steps ran)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail at the node execution step
          # (not at setup-node or npm install/build steps)
          # Any outcome other than 'skipped' means the action was invoked
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with outcome: $OUTCOME"

      - name: Verify dist/action.js was built by the action
        run: |
          # The action builds itself as part of its composite steps
          # Check that the action_path contains the built artifact
          if [ ! -f "$GITHUB_WORKSPACE/dist/action.js" ]; then
            echo "FAIL: dist/action.js not found - build step may have failed"
            exit 1
          fi
          echo "PASS: dist/action.js exists"
