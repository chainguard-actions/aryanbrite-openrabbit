name: Test no PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-testing-no-pr-context
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR context is present, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request context was available"
