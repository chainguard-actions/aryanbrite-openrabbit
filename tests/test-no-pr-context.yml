name: Test no PR context error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with API key but no PR context (expect failure)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_key: "fake-key-for-testing"
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"
        continue-on-error: true

      - name: Assert action failed due to missing PR context
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR context is available"
            exit 1
          fi
          echo "PASS: action correctly failed when no PR context was available"
