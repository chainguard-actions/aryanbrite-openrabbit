name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with only the required-ish inputs, relying on defaults
      # for llm_provider (openrouter), llm_api_url, llm_model (openrouter/free),
      # review_mode (both), tone_mode (balanced), review_lens (default), debiased_mode (false).
      # Without an llm_api_key the action should fail with a clear error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # No llm_api_key — triggers the "API key is required" guard

      - name: Assert action failed with missing API key error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no llm_api_key is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with default inputs and no API key"
