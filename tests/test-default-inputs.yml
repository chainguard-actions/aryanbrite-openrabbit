name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all defaults (no inputs specified)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed gracefully with defaults
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail gracefully when no inputs are provided"
            exit 1
          fi
          echo "PASS: action failed gracefully with default inputs (expected — no API key or PR context)"
