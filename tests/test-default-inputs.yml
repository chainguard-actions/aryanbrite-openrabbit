name: Test default inputs and build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default inputs (no api key, no PR context)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # llm_api_key intentionally omitted to test default/missing key path
          # All other inputs use their defaults:
          # llm_provider: openrouter
          # llm_api_url: https://openrouter.ai/api/v1
          # llm_model: openrouter/free
          # review_mode: both
          # tone_mode: balanced
          # review_lens: default
          # debiased_mode: false

      - name: Assert action failed gracefully (missing api key is the first guard)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because llm_api_key is not provided.
          # This confirms the build pipeline (npm install + tsc) succeeded
          # and the action ran to the point of validating inputs.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing api key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action built and ran successfully, failing at the expected validation point"
