name: Test security review lens
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-testing
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: strict
          review_lens: security
          debiased_mode: "true"

      - name: Assert action failed gracefully with security lens inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no pull_request context under workflow_dispatch.
          # A failure here means the action parsed all inputs correctly and reached the PR-number check.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (no PR context) after accepting security lens inputs"
          else
            echo "FAIL: expected failure outcome but got '$OUTCOME'"
            exit 1
          fi
