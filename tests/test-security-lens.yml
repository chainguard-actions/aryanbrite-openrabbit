name: Test security review lens
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with security review_lens (expect failure due to no PR context)
        id: action
        uses: .
        with:
          github_token: fake-token
          llm_api_key: fake-api-key
          llm_provider: openrouter
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: balanced
          review_lens: security
          debiased_mode: "false"
        continue-on-error: true

      - name: Assert action failed gracefully (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action with security review_lens failed gracefully due to missing PR context"
