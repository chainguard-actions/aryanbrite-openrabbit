name: Test invalid review lens falls back to default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid review lens (expect failure at PR context, not input validation)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_key: "fake-key-for-testing"
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: invalid-lens-value
          debiased_mode: "false"
        continue-on-error: true

      - name: Assert action failed at PR context check (invalid lens normalized to default)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR context is available"
            exit 1
          fi
          echo "PASS: action correctly normalized invalid lens and failed at PR context check"
