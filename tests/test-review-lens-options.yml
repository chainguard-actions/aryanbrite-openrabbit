name: Test review lens options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with security review lens (no PR context)
        id: action-security
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_api_key: "fake-key-for-testing"
          review_lens: security
          review_mode: summary

      - name: Assert security lens action failed at PR context check
        env:
          OUTCOME: ${{ steps.action-security.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action with security review_lens failed at expected validation point"

      - name: Run action with invalid review lens (should normalize to default)
        id: action-invalid-lens
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_api_key: "fake-key-for-testing"
          review_lens: invalid-lens-value
          review_mode: summary

      - name: Assert invalid lens action also failed at PR context check
        env:
          OUTCOME: ${{ steps.action-invalid-lens.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action with invalid review_lens (normalized to default) failed at expected validation point"
