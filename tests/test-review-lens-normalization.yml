name: Test review lens normalization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with an invalid lens value — should normalize to 'default' without crashing
      - id: action-invalid-lens
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-lens-test
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: invalid-lens-value
          debiased_mode: "false"

      - name: Assert action failed due to missing PR (not lens error)
        env:
          OUTCOME: ${{ steps.action-invalid-lens.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there's no PR context (workflow_dispatch),
          # NOT because of an invalid lens value (which gets normalized to 'default').
          # If outcome is 'failure', the lens normalization worked and the action
          # reached the PR number check before failing.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly normalized invalid lens and failed at PR context check"

      # Test with a valid security lens
      - id: action-security-lens
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-security-lens-test
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: strict
          review_lens: security
          debiased_mode: "false"

      - name: Assert security lens action failed due to missing PR (not config error)
        env:
          OUTCOME: ${{ steps.action-security-lens.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted security lens and failed at PR context check as expected"
