name: Test OpenRabbit review_mode summary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke OpenRabbit with review_mode=summary
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          llm_provider: openrouter
          llm_api_key: fake-api-key
          review_mode: summary
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with review_mode=summary, outcome: $OUTCOME"

      - name: Verify action.yml declares review_mode input
        run: |
          if ! grep -q 'review_mode' "$GITHUB_WORKSPACE/action.yml"; then
            echo "FAIL: review_mode input not found in action.yml"
            exit 1
          fi
          echo "PASS: review_mode input declared in action.yml"
