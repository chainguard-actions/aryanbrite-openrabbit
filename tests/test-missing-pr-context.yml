name: Test missing PR context error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action on push event without PR context (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          llm_provider: openrouter
          llm_api_key: "fake-api-key-for-testing"
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR context is available, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PR context was missing"
