name: Test basic usage with all key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          llm_api_key: fake-api-key-for-testing
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"
      - name: Assert action was invoked
        run: |
          echo "Action completed (with or without error due to missing real PR context)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without a real GitHub PR context,
          # but we verify it was invoked with the correct inputs
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with github_token and llm_api_key inputs"
