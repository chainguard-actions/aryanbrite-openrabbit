name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token-for-testing
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-llm-api-key-for-testing
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"
      - name: Assert action ran (build and setup completed)
        run: |
          # The action may fail due to no real PR/GitHub context, but
          # we verify the inputs were accepted and the action attempted to run.
          # A failure outcome (continue-on-error) is acceptable here since
          # there is no real PR to review in a local act environment.
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
