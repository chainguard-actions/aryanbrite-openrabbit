name: Test default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with only the required-ish inputs, relying on defaults
      # for llm_provider, llm_api_url, llm_model, review_mode, tone_mode,
      # review_lens, and debiased_mode.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          llm_api_key: fake-api-key-for-testing

      # The action should reach the node dist/action.js execution stage
      # (i.e., setup-node, npm install, and npm run build all succeed).
      # It will fail at the API call stage due to fake credentials, which is expected.
      - name: Assert action ran through build phase
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed build and setup phase with default inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
