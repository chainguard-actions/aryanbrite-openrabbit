name: Test review_mode, tone_mode, and debiased_mode inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with summary-only review mode and debiased enabled
        id: action-summary
        uses: .
        with:
          llm_api_key: fake-key-summary-test
          review_mode: summary
          tone_mode: strict
          review_lens: security
          debiased_mode: "true"
        continue-on-error: true

      - name: Assert action failed at PR check (inputs accepted)
        env:
          OUTCOME: ${{ steps.action-summary.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at PR number check, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted summary/strict/security/debiased inputs and reached PR number validation"

      - name: Run action with inline-only review mode and performance lens
        id: action-inline
        uses: .
        with:
          llm_api_key: fake-key-inline-test
          review_mode: inline
          tone_mode: educational
          review_lens: performance
          debiased_mode: "false"
        continue-on-error: true

      - name: Assert inline mode action failed at PR check (inputs accepted)
        env:
          OUTCOME: ${{ steps.action-inline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at PR number check, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted inline/educational/performance inputs and reached PR number validation"
