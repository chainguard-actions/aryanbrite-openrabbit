name: Test llm_api_key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_api_key: test-api-key-placeholder
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"
      - name: Assert action ran with llm_api_key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo has no real PR to review)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
