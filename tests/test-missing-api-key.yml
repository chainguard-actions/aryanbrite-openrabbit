name: Test missing LLM API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without an LLM API key — it should fail because the
      # action validates that llm_api_key is required before checking PR context.
      - id: action
        uses: .
        with:
          llm_provider: openrouter
          llm_model: openrouter/free
          review_mode: summary
        continue-on-error: true

      # The action must have failed (no API key provided)
      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no llm_api_key is provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when llm_api_key was not provided"
