name: Test missing LLM API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          llm_provider: openrouter
          llm_api_key: ""
          llm_model: openrouter/free
          review_mode: both

      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no API key is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when LLM API key is missing"
