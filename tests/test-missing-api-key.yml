name: Test missing API key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without API key (expect failure)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_key: ""
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"
        continue-on-error: true

      - name: Assert action failed due to missing API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no API key is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided"
