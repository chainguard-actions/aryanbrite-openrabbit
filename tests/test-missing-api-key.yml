name: Test missing LLM API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          llm_provider: openrouter
          llm_api_key: ""
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "false"
      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when llm_api_key is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when llm_api_key was not provided"
