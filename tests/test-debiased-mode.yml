name: Test debiased mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with debiased_mode enabled
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-api-key-for-testing
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "true"

      # Verify the action ran through the build phase with debiased_mode=true
      - name: Assert action ran with debiased mode enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with debiased_mode=true"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
