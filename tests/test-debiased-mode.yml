name: Test debiased_mode enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that debiased_mode=true is accepted and parsed correctly.
      # The action should still fail at the PR context check (no PR under
      # workflow_dispatch), confirming input parsing did not crash earlier.
      - id: action
        uses: .
        continue-on-error: true
        with:
          llm_provider: openrouter
          llm_api_key: "fake-key-for-testing"
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: security
          debiased_mode: "true"

      - name: Assert action failed at PR context check with debiased_mode enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted debiased_mode=true and failed correctly at PR context check"
