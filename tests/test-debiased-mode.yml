name: Test debiased mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with debiased_mode=true (truthy value)
      - id: action-debiased-true
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-debiased-test
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: default
          debiased_mode: "true"

      - name: Assert debiased=true action failed at PR context (not config error)
        env:
          OUTCOME: ${{ steps.action-debiased-true.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted debiased_mode=true and failed at PR context check"

      # Test with debiased_mode=false (default falsy value)
      - id: action-debiased-false
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-debiased-false-test
          llm_model: openrouter/free
          review_mode: inline
          tone_mode: educational
          review_lens: performance
          debiased_mode: "false"

      - name: Assert debiased=false action failed at PR context (not config error)
        env:
          OUTCOME: ${{ steps.action-debiased-false.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted debiased_mode=false and failed at PR context check"
