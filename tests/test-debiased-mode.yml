name: Test debiased_mode enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that debiased_mode=true is accepted and the action proceeds to the PR context check.
      # Under workflow_dispatch there is no PR, so the action will fail at the PR number check.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-api-key-for-testing
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: security
          debiased_mode: "true"

      - name: Assert action failed at PR context check (debiased_mode accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly accepted debiased_mode=true and failed at PR context check"
