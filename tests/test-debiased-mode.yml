name: Test debiased_mode input parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that debiased_mode=true is accepted and parsed correctly.
      # The action should still fail at the PR context check (no PR in workflow_dispatch),
      # confirming the build and input parsing succeeded.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_key: "fake-api-key-for-testing"
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: strict
          review_lens: security
          debiased_mode: "true"

      - name: Assert action failed at PR context check with debiased_mode enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR context (workflow_dispatch),
          # not because of any input parsing error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR context is present, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at PR context check with debiased_mode=true"
