name: Test debiased mode enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-key-for-testing-debiased-mode
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: balanced
          review_lens: security
          debiased_mode: "true"

      - name: Assert action failed at PR context check with debiased_mode enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With debiased_mode=true and no PR context, the action should still
          # fail at the PR number check (not crash during input parsing).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at PR context check), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action handled debiased_mode=true and failed correctly at PR context check"
