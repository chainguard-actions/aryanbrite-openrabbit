name: Test invalid review_lens falls back to default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action normalizes unknown review_lens values to 'default'.
      # With a fake API key and no PR context (workflow_dispatch), the action
      # should still fail at the PR number check — not at the review_lens check.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_key: "fake-api-key-for-testing"
          llm_model: openrouter/free
          review_mode: both
          tone_mode: balanced
          review_lens: "invalid-lens-value"
          debiased_mode: "false"

      - name: Assert action failed at PR context check (not at review_lens)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR context (workflow_dispatch),
          # not because of the invalid review_lens (which is normalized to 'default').
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR context is present, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at PR context check (review_lens was normalized)"
