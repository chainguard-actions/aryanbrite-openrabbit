name: Test invalid review lens normalization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action normalizes an unrecognized review_lens value to 'default'.
      # With a fake API key and no PR context (workflow_dispatch), the action
      # still fails at the PR-number guard — but the build/setup steps succeed,
      # confirming the action can be invoked with these inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-api-key-for-testing
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: strict
          review_lens: invalid-lens-value
          debiased_mode: "true"

      - name: Assert action failed at PR context check (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at PR context check with invalid review_lens input"
