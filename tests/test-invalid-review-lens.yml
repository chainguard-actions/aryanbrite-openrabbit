name: Test invalid review_lens is normalized
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With an invalid review_lens value, the action normalizes it to 'default'
      # and proceeds. Since there is no PR context under workflow_dispatch,
      # the action should fail at the PR-number check (not at the lens check),
      # confirming the lens normalization did not cause an earlier crash.
      - id: action
        uses: .
        continue-on-error: true
        with:
          llm_provider: openrouter
          llm_api_key: "fake-key-for-testing"
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: balanced
          review_lens: invalid-lens-value
          debiased_mode: "false"

      - name: Assert action failed at PR context check (not at lens validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR number in the context,
          # meaning it successfully passed the lens normalization step.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action handled invalid review_lens gracefully and failed at PR context check"
