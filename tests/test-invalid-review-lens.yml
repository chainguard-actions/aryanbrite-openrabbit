name: Test invalid review_lens is normalized to default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action normalizes unknown review_lens values to 'default' silently.
      # It will still fail because there is no PR context under workflow_dispatch,
      # but it should NOT fail due to an invalid lens value (that would be a different error path).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-api-key-for-testing
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: strict
          review_lens: invalid-lens-value
          debiased_mode: "false"

      - name: Assert action failed at PR context check (not at lens validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR, not because of the invalid lens.
          # The lens normalization should have silently converted 'invalid-lens-value' to 'default'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed at PR context check as expected (lens was normalized silently)"
