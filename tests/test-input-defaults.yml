name: Test input defaults and validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all defaults (no inputs specified, expect failure on missing API key)
        id: action-defaults
        uses: .
        continue-on-error: true

      - name: Assert action failed on missing API key (not a setup/build error)
        env:
          OUTCOME: ${{ steps.action-defaults.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with all-default inputs (missing API key)"

      - name: Run action with security review lens (expect failure on missing API key)
        id: action-security-lens
        uses: .
        continue-on-error: true
        with:
          review_lens: security
          tone_mode: nitpick
          review_mode: inline
          debiased_mode: "true"

      - name: Assert security lens action also failed on missing API key
        env:
          OUTCOME: ${{ steps.action-security-lens.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key with security lens, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action with security lens failed as expected (missing API key)"

      - name: Run action with invalid review lens (should normalize to default, fail on missing API key)
        id: action-invalid-lens
        uses: .
        continue-on-error: true
        with:
          review_lens: "not-a-valid-lens"
          review_mode: summary

      - name: Assert invalid lens action also failed on missing API key
        env:
          OUTCOME: ${{ steps.action-invalid-lens.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key with invalid lens, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action with invalid lens (normalized to default) failed as expected (missing API key)"
