name: Test summary review mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with summary mode (expect failure without real credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          llm_provider: openrouter
          llm_api_url: https://openrouter.ai/api/v1
          llm_api_key: fake-api-key
          llm_model: openrouter/free
          review_mode: summary
          tone_mode: formal
          review_lens: security
          debiased_mode: "false"

      - name: Assert action ran with summary mode
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked in summary mode (outcome: ${{ steps.action.outcome }})"
