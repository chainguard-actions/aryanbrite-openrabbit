name: OpenRabbit
description: GitHub Action that generates PR review summaries and inline comments using any LLM provider.
inputs:
  github_token:
    description: GitHub token for PR review actions
    required: false
  llm_provider:
    description: LLM provider key
    required: false
    default: openrouter
  llm_api_url:
    description: Base URL for the LLM provider
    required: false
    default: https://openrouter.ai/api/v1
  llm_api_key:
    description: API key for the LLM provider
    required: false
  llm_model:
    description: Model name for the configured LLM provider
    required: false
    default: openrouter/free
  review_mode:
    description: Create summary, inline comments, or both
    required: false
    default: both
  tone_mode:
    description: Tone profile for the review output
    required: false
    default: balanced
  review_lens:
    description: Focused review lens (default, security, socratic, performance, scope-guard)
    required: false
    default: default
  debiased_mode:
    description: Redact PR metadata for the initial pass
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install
      shell: bash
      working-directory: ${{ github.action_path }}
    - name: Build action
      run: npm run build
      shell: bash
      working-directory: ${{ github.action_path }}
    - name: Run Coderabbit reviewer
      run: node dist/action.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        LLM_PROVIDER: ${{ inputs.llm_provider }}
        LLM_API_URL: ${{ inputs.llm_api_url }}
        LLM_API_KEY: ${{ inputs.llm_api_key }}
        LLM_MODEL: ${{ inputs.llm_model }}
        REVIEW_MODE: ${{ inputs.review_mode }}
        TONE_MODE: ${{ inputs.tone_mode }}
        REVIEW_LENS: ${{ inputs.review_lens }}
        DEBIASED_MODE: ${{ inputs.debiased_mode }}
